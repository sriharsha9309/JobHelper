tailor:
  model: gemini-2.5-flash   # free tier works; change if Google renames/retires it
  port: 8765                # job-alerts' "Tailor" button links here
  max_total_bullets: 14     # experience bullets across all roles (~1-2 pages)
  max_projects: 2
  keyword_target: [25, 35]  # role keywords on the resume; below = invisible in searches, above = looks stuffed
  jobs_json: ../job-alerts/data/jobs.json   # lets the Tailor button prefill title/company/JD

# DOCX look. Stays ATS-safe: one column, real text, no tables/text boxes/headers/footers.
template:
  font: Calibri             # safe choices: Calibri, Arial, Garamond, Cambria
  body_size: 10.5
  name_size: 20
  heading_size: 11.5
  accent: "1F3864"          # navy; use "000000" for all black
  page: A4                  # A4 (India/EU) or Letter (US)
  margin_in: 0.6

# Keyword vocabulary: canonical name -> aliases. Used to find JD keywords, score bullets and block
# AI rewrites that add skills the original bullet does not support. Skills in master.yaml are added automatically.
